version: '3'

vars:
  APPNAME: pgbouncer-healthcheck
  VERSION:
    sh: cat VERSION
  BUILD_DATE:
    sh: date -u '+%Y-%m-%d %H:%M'
  # Container tool: podman or docker
  CONTAINER_TOOL: '{{.CONTAINER_TOOL | default "podman"}}'
  # Target architecture, defaults to the host's. Use ARCH=amd64 for release builds.
  ARCH: '{{.ARCH | default ARCH}}'
  PLATFORM: linux/{{.ARCH}}
  DIST: dist
  BINARY: '{{.DIST}}/linux-{{.ARCH}}/{{.APPNAME}}'
  # GitHub release settings
  TAG: v{{.VERSION}}
  RELEASE_BRANCH: '{{.RELEASE_BRANCH | default "master"}}'
  RELEASE_ARCHES: amd64 arm64
  RELEASE_DIR: '{{.DIST}}/release'
  BUILD_ARGS: >-
    --platform {{.PLATFORM}}
    --build-arg VERSION={{.VERSION}}
    --build-arg "BUILD_DATE={{.BUILD_DATE}}"

tasks:
  default:
    cmds:
      - task --list

  build:
    desc: Build the static {{.APPNAME}} binary into {{.DIST}}/linux-<arch>/
    label: build-{{.ARCH}}
    sources:
      - '*.go'
      - go.mod
      - go.sum
      - VERSION
      - Dockerfile
    generates:
      - '{{.BINARY}}'
    # `build --output` is unsupported by podman's remote mode (macOS), so copy
    # the binary out of a stopped container instead
    cmds:
      - rm -f {{.BINARY}}
      - mkdir -p $(dirname {{.BINARY}})
      - '{{.CONTAINER_TOOL}} build {{.BUILD_ARGS}} --target runtime -t {{.APPNAME}}:build .'
      - |
        cid=$({{.CONTAINER_TOOL}} create --platform {{.PLATFORM}} {{.APPNAME}}:build)
        trap '{{.CONTAINER_TOOL}} rm "$cid" >/dev/null' EXIT
        {{.CONTAINER_TOOL}} cp "$cid:/{{.APPNAME}}" {{.BINARY}}
      - file {{.BINARY}} || true

  image:
    desc: Build the minimal (scratch) runtime image
    cmds:
      - '{{.CONTAINER_TOOL}} build {{.BUILD_ARGS}} --target runtime -t {{.APPNAME}}:{{.VERSION}} .'

  test:image:
    internal: true
    label: test-image-{{.ARCH}}
    sources:
      - '*.go'
      - go.mod
      - go.sum
      - VERSION
      - Dockerfile
      - tests/**/*
    cmds:
      - '{{.CONTAINER_TOOL}} build {{.BUILD_ARGS}} --target test -t {{.APPNAME}}:test .'

  test:
    desc: Run the integration tests against PGBouncer (pass script names after -- to run a subset)
    deps: [test:image]
    env:
      CONTAINER_TOOL: '{{.CONTAINER_TOOL}}'
    cmds:
      - tests/run_tests.sh {{.APPNAME}}:test {{.CLI_ARGS}}

  vet:
    desc: Run go vet and check formatting locally
    cmds:
      - go vet ./...
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

  tidy:
    desc: Tidy go.mod/go.sum
    cmds:
      - go mod tidy

  stash:
    desc: Zip the binary into the CI workspace
    deps: [build]
    cmds:
      - mkdir -p workspace
      - zip -j workspace/{{.APPNAME}}-$CIRCLE_SHA1.zip {{.BINARY}}

  unstash:
    desc: Unzip the binary from the CI workspace
    cmds:
      - mkdir -p $(dirname {{.BINARY}})
      - unzip -o workspace/{{.APPNAME}}-$CIRCLE_SHA1.zip -d $(dirname {{.BINARY}})

  upload:
    desc: Upload the binary to S3
    cmds:
      - aws s3 cp "{{.BINARY}}" "s3://roo-apps-private-binaries/{{.APPNAME}}-{{.VERSION}}"

  release:assets:
    desc: Build release binaries for all arches plus SHA256SUMS into {{.RELEASE_DIR}}/
    cmds:
      # Separate task invocations: top-level vars (BINARY, PLATFORM) are
      # computed once per run, so passing ARCH to a called task isn't enough
      - for: { var: RELEASE_ARCHES }
        cmd: task build ARCH={{.ITEM}} CONTAINER_TOOL={{.CONTAINER_TOOL}}
      - rm -rf {{.RELEASE_DIR}} && mkdir -p {{.RELEASE_DIR}}
      - for: { var: RELEASE_ARCHES }
        cmd: cp {{.DIST}}/linux-{{.ITEM}}/{{.APPNAME}} {{.RELEASE_DIR}}/{{.APPNAME}}-{{.VERSION}}-linux-{{.ITEM}}
      - |
        cd {{.RELEASE_DIR}}
        if command -v sha256sum >/dev/null; then sha256sum {{.APPNAME}}-*; else shasum -a 256 {{.APPNAME}}-*; fi > SHA256SUMS
        cat SHA256SUMS

  release:
    desc: Tag v<VERSION>, push the tag, and publish a GitHub release with binaries (from {{.RELEASE_BRANCH}})
    vars:
      NOTES_FILE: '{{.RELEASE_DIR}}/RELEASE_NOTES.md'
    preconditions:
      - sh: gh --version
        msg: 'GitHub CLI not found. Install with: brew install gh && gh auth login'
      - sh: gh auth status
        msg: 'Not logged in to GitHub. Run: gh auth login'
      - sh: test -z "$(git status --porcelain)"
        msg: Working tree is not clean; commit or stash changes first
      - sh: test "$(git branch --show-current)" = "{{.RELEASE_BRANCH}}"
        msg: 'Releases are cut from {{.RELEASE_BRANCH}} (override with RELEASE_BRANCH=...)'
      - sh: git fetch --quiet --tags origin && test "$(git rev-parse HEAD)" = "$(git rev-parse origin/{{.RELEASE_BRANCH}})"
        msg: 'HEAD is not the same as origin/{{.RELEASE_BRANCH}}; push or pull first'
      - sh: '! git rev-parse --quiet --verify "refs/tags/{{.TAG}}" >/dev/null'
        msg: 'Tag {{.TAG}} already exists; bump VERSION'
      - sh: grep -Eq '^## \[{{.VERSION}}\] - [0-9]{4}-[0-9]{2}-[0-9]{2}' CHANGELOG.md
        msg: 'CHANGELOG.md needs a dated "## [{{.VERSION}}] - YYYY-MM-DD" section (not "Unreleased")'
    cmds:
      - task: release:assets
      # Release notes are the CHANGELOG section for this version
      - awk '/^## \[/{p = index($0, "## [{{.VERSION}}]") == 1; next} p' CHANGELOG.md > {{.NOTES_FILE}}
      - git tag -a {{.TAG}} -m "{{.APPNAME}} {{.VERSION}}"
      - git push origin {{.TAG}}
      - gh release create {{.TAG}} --verify-tag --title "{{.APPNAME}} {{.VERSION}}" --notes-file {{.NOTES_FILE}} {{.RELEASE_DIR}}/{{.APPNAME}}-* {{.RELEASE_DIR}}/SHA256SUMS

  clean:
    desc: Remove build artifacts
    cmds:
      - rm -rf {{.DIST}} workspace .task
